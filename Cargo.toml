[package]
name = "gn"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "6.0.0"
env_logger = "0.11.10"
global-hotkey = "0.8"
log = "0.4.32"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tray-icon = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
] }
objc2-foundation = "0.3"
